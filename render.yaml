databases:
  - name: dream-catcher-db
    plan: free
    databaseName: dreamcatcher
    user: dreamcatcher

services:
  - type: web
    name: dream-catcher
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.x
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: DATABASE_URL
        fromDatabase:
          name: dream-catcher-db
          property: connectionString
      - key: NODE_ENV
        value: production
